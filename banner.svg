<svg width="100%" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glassmorphic Canvas Fill -->
    <linearGradient id="glassCanvas" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="50%" stop-color="#0D0F18"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <!-- Liquid Flowing Gradient for Border (Continuous Laser Light Stream) -->
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#6EE7B7;#9333EA;#00F2FE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#9333EA;#00F2FE;#6EE7B7;#4FACFE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6EE7B7">
        <animate attributeName="stop-color" values="#6EE7B7;#00F2FE;#4FACFE;#9333EA;#6EE7B7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle Tech Matrix Grid -->
    <pattern id="glassGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E2333" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="24" cy="24" r="0.6" fill="#333A4E" opacity="0.6"/>
    </pattern>

    <!-- Water Glow Filter -->
    <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Base Card Surface (Glass Texture) -->
  <rect width="900" height="200" rx="18" fill="url(#glassCanvas)"/>
  <rect width="900" height="200" rx="18" fill="url(#glassGrid)"/>

  <!-- Static Glass Border Inner Structure -->
  <rect x="1" y="1" width="898" height="198" rx="17" fill="none" stroke="#1F2433" stroke-width="1.2"/>

  <!-- Live Glowing Liquid Border Laser (Clearly & Visibly Gliding in Real Time) -->
  <rect x="1.5" y="1.5" width="897" height="197" rx="17" fill="none" stroke="url(#waterFlow)" stroke-width="3" stroke-dasharray="240 850" stroke-linecap="round" filter="url(#liquidGlow)">
    <animate attributeName="stroke-dashoffset" from="2180" to="0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- High-Precision Glass Architectural Corner Reticles -->
  <path d="M 28 14 L 14 14 L 14 28" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 872 14 L 886 14 L 886 28" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 28 186 L 14 186 L 14 172" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 872 186 L 886 186 L 886 172" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ambient Light Reflection -->
  <ellipse cx="450" cy="95" rx="260" ry="50" fill="#00F2FE" opacity="0.05" filter="url(#liquidGlow)"/>

  <!-- Main Center Glass Typography Content -->
  <g text-anchor="middle" filter="url(#textGlow)">
    <!-- Main Architect Name (Futuristic Cyber-Architect Bold) -->
    <text x="450" y="74" fill="#FFFFFF" font-family="'Orbitron', 'Rajdhani', 'Space Grotesk', 'Chakra Petch', 'JetBrains Mono', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="3.5">RUCHIT GHOGHARI</text>
    
    <!-- Subtitle Specifier -->
    <text x="450" y="108" fill="#94A3B8" font-family="'JetBrains Mono', 'Roboto Mono', 'SF Mono', monospace" font-size="12.5" font-weight="600" letter-spacing="2.2">SYSTEMS ARCHITECT • DISTRIBUTED ENGINES • AUTONOMOUS AI SYSTEMS</text>

    <!-- Glass Email Layout: No round box, flanked by sleek technical lines on left & right -->
    <g transform="translate(450, 148)">
      <!-- Left Precision Tech Line with Diamond Indicator -->
      <line x1="-280" y1="0" x2="-140" y2="0" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4"/>
      <polygon points="-138,-3.5 -133,0 -138,3.5 -143,0" fill="#00F2FE"/>

      <!-- Clean Mail Icon (No round circle or enclosing box!) -->
      <path d="M -112 -8 L -100 0 L -88 -8 M -114 -10 H -86 C -85 -10 -84 -9 -84 -8 V 2 C -84 3 -85 4 -86 4 H -114 C -115 4 -116 3 -116 2 V -8 C -116 -9 -115 -10 -114 -10 Z" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Sharp High-Contrast Monospace Email Address -->
      <text x="18" y="0" fill="#F8FAFC" font-family="'JetBrains Mono', 'Roboto Mono', 'SF Mono', monospace" font-size="14.5" font-weight="700" letter-spacing="1.2">ruchitghoghari@rgai.in</text>

      <!-- Right Precision Tech Line with Diamond Indicator -->
      <polygon points="138,-3.5 143,0 138,3.5 133,0" fill="#00F2FE"/>
      <line x1="140" y1="0" x2="280" y2="0" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4"/>
    </g>
  </g>
</svg>
